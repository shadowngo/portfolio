<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Nguyễn Thành Tâm</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* ─── DESIGN TOKENS ─────────────────────────────────── */
    :root {
      --ink: #12131a;
      --ink2: #1e2030;
      --ink3: #2c3050;
      --paper: #faf9f7;
      --paper2: #f0ede8;
      --paper3: #e6e1d9;
      --gold: #c77c2a;
      --gold-lt: #e09940;
      --gold-pale: rgba(199, 124, 42, 0.10);
      --teal: #1a6e60;
      --teal-lt: #28917f;
      --teal-pale: rgba(26, 110, 96, 0.10);
      --rust: #b03a1e;
      --rust-pale: rgba(176, 58, 30, 0.10);
      --text: #1e2030;
      --muted: #4a4f68;
      --dim: #7a7f98;
      --border: rgba(30, 32, 48, 0.13);
      --border2: rgba(30, 32, 48, 0.07);
      --shadow: 0 2px 24px rgba(18, 19, 26, 0.09);
      --shadow-lg: 0 8px 48px rgba(18, 19, 26, 0.14);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--paper);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      line-height: 1.85;
      overflow-x: hidden;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: .4;
    }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-track {
      background: var(--paper2)
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 2px
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 5rem;
      background: rgba(246, 243, 238, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: .8rem;
    }

    .nav-initials {
      width: 34px;
      height: 34px;
      border-radius: 3px;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: .9rem;
      font-weight: 700;
      color: var(--gold-lt);
      letter-spacing: .05em;
    }

    .nav-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: .76rem;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none
    }

    .nav-links a {
      font-size: .85rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: .04em;
      transition: color .2s;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 100%;
      height: 1px;
      background: var(--gold);
      transition: right .25s;
    }

    .nav-links a:hover {
      color: var(--gold)
    }

    .nav-links a:hover::after {
      right: 0
    }

    /* ─── HERO ─── */
    .hero {
      min-height: 100vh;
      padding: 9rem 5rem 5rem;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 4rem;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-bg-text {
      position: absolute;
      right: -2rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18vw;
      font-weight: 700;
      color: rgba(42, 45, 56, 0.04);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      color: var(--teal);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: .8rem;
      font-weight: 500;
    }

    .hero-eyebrow::before {
      content: '';
      width: 1.8rem;
      height: 1px;
      background: var(--teal);
      display: inline-block;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 4.5vw, 5rem);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -.02em;
      margin-bottom: 1rem;
    }

    .hero h1 .italic {
      font-style: italic;
      color: var(--gold)
    }

    .hero h1 .line2 {
      display: block;
      font-weight: 400;
      font-size: .65em;
      color: var(--muted);
      margin-top: .2rem
    }

    .hero-desc {
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 400;
      max-width: 46ch;
      line-height: 1.9;
      margin-bottom: 2rem;
    }

    .hero-meta {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin-bottom: 2rem;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: .8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
    }

    .meta-row .label {
      color: var(--dim);
      min-width: 6rem
    }

    .meta-row .value {
      color: var(--ink2);
      font-weight: 600;
    }

    .hero-actions {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap
    }

    /* ─── AVATAR BOX ─── */
    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .avatar-frame {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 3/4;
      background: var(--paper2);
      border: 2px dashed var(--border2);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .3s, background .3s;
    }

    .avatar-frame:hover {
      border-color: var(--gold);
      background: var(--gold-pale)
    }

    .avatar-frame input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .avatar-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      pointer-events: none;
    }

    .avatar-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--paper3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--dim);
      border: 2px solid var(--border);
    }

    .avatar-upload-label {
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .avatar-upload-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      letter-spacing: .1em;
      color: var(--gold);
      text-transform: uppercase;
      padding: .3rem .8rem;
      border: 1px solid rgba(184, 134, 11, .35);
      border-radius: 2px;
      background: transparent;
      pointer-events: none;
    }

    #avatar-preview {
      position: absolute;
      inset: 0;
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 6px;
    }

    .avatar-caption {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      color: var(--dim);
      letter-spacing: .1em;
      text-align: center;
      line-height: 1.8;
    }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .65rem 1.5rem;
      border-radius: 3px;
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      text-decoration: none;
      transition: all .22s;
      border: none;
    }

    .btn-primary {
      background: var(--ink);
      color: var(--gold-lt)
    }

    .btn-primary:hover {
      background: var(--ink2);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(26, 28, 35, .18)
    }

    .btn-outline {
      background: transparent;
      color: var(--gold);
      border: 1px solid rgba(184, 134, 11, .4)
    }

    .btn-outline:hover {
      background: var(--gold-pale);
      border-color: var(--gold)
    }

    .btn-teal {
      background: transparent;
      color: var(--teal);
      border: 1px solid rgba(45, 122, 111, .4)
    }

    .btn-teal:hover {
      background: var(--teal-pale)
    }

    /* ─── SECTION BASE ─── */
    section {
      padding: 5rem 5rem
    }

    .s-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      color: var(--gold);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: .7rem;
      display: flex;
      align-items: center;
      gap: .8rem;
      font-weight: 500;
    }

    .s-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .s-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 2.8vw, 2.4rem);
      font-weight: 700;
      margin-bottom: .4rem;
      letter-spacing: -.01em;
    }

    .s-sub {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 400;
      max-width: 58ch;
      margin-bottom: 2.5rem;
      line-height: 1.85;
    }

    /* ─── ABOUT SECTION ─── */
    #about {
      background: var(--paper2);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border)
    }

    .about-body {
      display: grid;
      grid-template-columns: 1fr 2.2fr;
      gap: 4rem;
      align-items: start;
      margin-top: 2.5rem;
    }

    .about-sidebar {}

    .about-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1.8rem;
      margin-bottom: 1rem;
    }

    .about-card-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      letter-spacing: .15em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: .6rem;
      font-weight: 500;
    }

    .about-card-value {
      font-size: .92rem;
      color: var(--ink2);
      font-weight: 500;
      line-height: 1.6
    }

    .skill-pills {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .8rem
    }

    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: .67rem;
      padding: .28rem .7rem;
      border-radius: 2px;
      letter-spacing: .07em;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
    }

    .pill-gold {
      border-color: rgba(184, 134, 11, .35);
      color: var(--gold)
    }

    .pill-teal {
      border-color: rgba(45, 122, 111, .35);
      color: var(--teal)
    }

    .about-main p {
      font-size: 1rem;
      color: var(--text);
      font-weight: 400;
      line-height: 1.95;
      margin-bottom: 1rem;
    }

    .about-main p strong {
      font-weight: 600;
      color: var(--ink)
    }

    .quote-block {
      border-left: 3px solid var(--gold);
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      background: var(--gold-pale);
      border-radius: 0 4px 4px 0;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--ink2);
      line-height: 1.7;
    }

    /* ─── ASSIGNMENTS ─── */
    #projects {
      background: var(--paper)
    }

    .assignments-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .a-card {
      background: var(--paper2);
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .3s, box-shadow .3s, border-color .3s;
    }

    .a-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(184, 134, 11, .25);
    }

    .a-card-header {
      padding: 1.5rem 1.8rem 1.2rem;
      border-bottom: 1px solid var(--border2);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .a-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      letter-spacing: .15em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: .4rem;
      font-weight: 500;
    }

    .a-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: .66rem;
      padding: .22rem .65rem;
      border-radius: 2px;
      letter-spacing: .08em;
      text-transform: uppercase;
      flex-shrink: 0;
      font-weight: 500;
    }

    .b-gold {
      background: var(--gold-pale);
      color: var(--gold);
      border: 1px solid rgba(184, 134, 11, .25)
    }

    .b-teal {
      background: var(--teal-pale);
      color: var(--teal);
      border: 1px solid rgba(45, 122, 111, .25)
    }

    .b-rust {
      background: var(--rust-pale);
      color: var(--rust);
      border: 1px solid rgba(155, 66, 32, .25)
    }

    .b-ink {
      background: rgba(42, 45, 56, .07);
      color: var(--ink2);
      border: 1px solid rgba(42, 45, 56, .12)
    }

    .a-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
    }

    .a-body {
      padding: 1.2rem 1.8rem;
      flex: 1
    }

    .a-body p {
      font-size: .92rem;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.85;
      margin-bottom: .8rem;
    }

    .a-body p strong {
      color: var(--ink2);
      font-weight: 600;
    }

    .a-insight {
      background: var(--paper);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 1rem 1.2rem;
      margin-top: .8rem;
    }

    .a-insight-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .66rem;
      color: var(--gold);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: .4rem;
      font-weight: 500;
    }

    .a-insight p {
      font-size: .88rem;
      margin: 0
    }

    /* PROMPT COMPARE */
    .prompt-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .8rem;
      margin-top: .8rem;
    }

    .prompt-box {
      border-radius: 4px;
      padding: 1rem;
      border: 1px solid var(--border);
    }

    .prompt-box.bad {
      background: rgba(155, 66, 32, .05);
      border-color: rgba(155, 66, 32, .2)
    }

    .prompt-box.good {
      background: rgba(45, 122, 111, .05);
      border-color: rgba(45, 122, 111, .2)
    }

    .prompt-box-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .66rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: .5rem;
      font-weight: 500;
    }

    .bad .prompt-box-label {
      color: var(--rust)
    }

    .good .prompt-box-label {
      color: var(--teal)
    }

    .prompt-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: var(--text);
      line-height: 1.7;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
    }

    /* PRINCIPLES */
    .principles {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      margin-top: .8rem
    }

    .principle {
      display: flex;
      gap: .8rem;
      align-items: flex-start;
      background: var(--paper);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: .85rem 1rem;
    }

    .p-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      color: var(--gold);
      background: var(--gold-pale);
      width: 22px;
      height: 22px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 500;
    }

    .p-text {
      font-size: .9rem;
      color: var(--text);
      font-weight: 400;
      line-height: 1.7
    }

    .p-text strong {
      color: var(--ink);
      font-weight: 600
    }

    /* FOOTER CARD */
    .a-footer {
      padding: 1rem 1.8rem;
      border-top: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
    }

    .a-footer-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      color: var(--dim);
      letter-spacing: .08em;
    }

    .a-link {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--teal);
      text-decoration: none;
      padding: .3rem .8rem;
      border: 1px solid rgba(26, 110, 96, .35);
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      transition: all .2s;
      font-weight: 500;
    }

    .a-link:hover {
      background: var(--teal-pale)
    }

    /* ─── CONCLUSION ─── */
    #conclusion {
      background: var(--paper2);
      border-top: 1px solid var(--border)
    }

    .conclusion-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 3rem;
      align-items: start;
      margin-top: 2.5rem;
    }

    .conclusion-essay p {
      font-size: 1rem;
      color: var(--text);
      font-weight: 400;
      line-height: 1.95;
      margin-bottom: 1.1rem;
    }

    .conclusion-essay p strong {
      font-weight: 600;
      color: var(--ink)
    }

    .conclusion-essay h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      margin: 1.5rem 0 .6rem;
    }

    .lessons-sidebar {}

    .lesson-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
    }

    .lesson-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--gold);
    }

    .lesson-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: .67rem;
      color: var(--gold);
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: .5rem;
      font-weight: 500;
    }

    .lesson-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: .5rem;
      line-height: 1.3;
    }

    .lesson-body {
      font-size: .88rem;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.75;
    }

    .action-plan {
      background: var(--ink);
      border-radius: 5px;
      padding: 1.5rem;
      color: var(--paper);
      margin-top: 1rem;
    }

    .action-plan-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .67rem;
      color: var(--gold-lt);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .action-item {
      display: flex;
      gap: .7rem;
      margin-bottom: .7rem;
      font-size: .88rem;
      color: rgba(250, 249, 247, .82);
      font-weight: 400;
      line-height: 1.65;
    }

    .action-item::before {
      content: '→';
      color: var(--gold-lt);
      font-size: .75rem;
      flex-shrink: 0;
      margin-top: .1rem;
    }

    /* ─── SUBMISSION ─── */
    #submission {
      background: var(--paper);
      border-top: 1px solid var(--border)
    }

    .sub-box {
      background: var(--ink);
      border-radius: 6px;
      padding: 3rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
      margin-top: 2rem;
    }

    .sub-info h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: var(--paper);
      font-weight: 700;
      margin-bottom: .8rem;
    }

    .sub-info p {
      font-size: .85rem;
      color: rgba(246, 243, 238, .6);
      font-weight: 300;
      line-height: 1.8;
      margin-bottom: .6rem;
    }

    .platform-chips {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: 1.2rem
    }

    .chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      padding: .3rem .8rem;
      border-radius: 2px;
      border: 1px solid rgba(212, 168, 67, .3);
      color: var(--gold-lt);
      letter-spacing: .08em;
    }

    .sub-steps {
      display: flex;
      flex-direction: column;
      gap: .7rem
    }

    .sub-step {
      display: flex;
      gap: .9rem;
      align-items: center;
      background: rgba(246, 243, 238, .05);
      border: 1px solid rgba(246, 243, 238, .07);
      border-radius: 3px;
      padding: .85rem 1.1rem;
      font-size: .83rem;
      color: rgba(246, 243, 238, .7);
      font-weight: 300;
    }

    .step-n {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      color: var(--gold-lt);
      background: rgba(212, 168, 67, .12);
      width: 22px;
      height: 22px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ─── FOOTER ─── */
    footer {
      padding: 2rem 5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--paper2);
    }

    footer p {
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      color: var(--dim);
      letter-spacing: .08em;
    }

    .footer-sig {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--gold);
      font-weight: 600;
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .hero-content {
      opacity: 0;
      animation: fadeUp .8s .1s forwards
    }

    .hero-right {
      opacity: 0;
      animation: fadeUp .9s .35s forwards
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .6s, transform .6s
    }

    .reveal.in {
      opacity: 1;
      transform: none
    }

    /* ─── RESPONSIVE ─── */
    @media(max-width:960px) {
      nav {
        padding: 1rem 1.5rem
      }

      .nav-links {
        display: none
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 7rem 1.5rem 3rem
      }

      .hero-right {
        padding-top: 2rem
      }

      section {
        padding: 3.5rem 1.5rem
      }

      .about-body {
        grid-template-columns: 1fr
      }

      .assignments-grid {
        grid-template-columns: 1fr
      }

      .prompt-compare {
        grid-template-columns: 1fr
      }

      .conclusion-grid {
        grid-template-columns: 1fr
      }

      .sub-box {
        grid-template-columns: 1fr;
        padding: 2rem
      }

      footer {
        flex-direction: column;
        gap: .7rem;
        text-align: center
      }
    }
  
  </style>
</head>
